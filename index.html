    }
    grid.appendChild(card);
  });
}

/**
 * 依据 SECTION_CONFIG 生成六大板块的「骨架」：顺序、显隐、标题、锚点 id 全部由配置驱动。
 * 做法：遍历 SECTION_CONFIG → 跳过 hidden → 建 <section id=cfg.key> →
 *       写入编号 + 标题 + 各内容容器（slots）。
 * ⚠️ 必须在所有 render* 函数之前调用 —— 渲染函数要靠这里生成的内容容器 id 找落点。
 * ⚠️ 隐藏的板块不会生成 DOM，对应的 render* 函数因 byId 取不到容器而自动跳过，安全。
 */
function buildSections() {
  const root = byId('sectionsRoot');
  if (!root) return;
  clear(root);

  let visibleIndex = 0;
  SECTION_CONFIG.forEach(function (cfg) {
    if (cfg.hidden) return;                        // 隐藏板块：不生成 DOM，导航也同步少一项
    visibleIndex += 1;

    const section = el('section', {
      className: 'section',
      attrs: { 'data-section': cfg.key }           // 只标 data-section；id 下面用 cfg.key 赋值
    });
    section.id = cfg.key;                          // ★ 板块锚点 = 配置 key（与导航 href 同源）

    const wrap = el('div', { className: 'wrap' });

    // 板块头：编号（按可见顺序自动 01/02/…）+ 标题 + 装饰线
    const head = el('div', { className: 'section-head' });
    head.appendChild(el('span', {
      className: 'idx mono',
      text: String(visibleIndex).padStart(2, '0')
    }));
    head.appendChild(el('h2', { text: cfg.title }));
    head.appendChild(el('span', { className: 'line', attrs: { 'aria-hidden': 'true' } }));
    wrap.appendChild(head);

    // 内容容器（渲染函数的写入落点）
    (cfg.slots || []).forEach(function (slot) {
      wrap.appendChild(el('div', { className: slot.cls, attrs: { id: slot.id } }));
    });

    section.appendChild(wrap);
    root.appendChild(section);
  });
}

/**
 * 生成顶部导航：直接由 SECTION_CONFIG 驱动（不再反查 DOM）。
 * 好处：板块顺序 / 显隐与配置天然一致，隐藏板块时导航自动同步。
 */
function renderNav() {
  const nav = byId('nav');
  if (!nav) return;
  clear(nav);

  SECTION_CONFIG.forEach(function (cfg) {
    if (cfg.hidden) return;                        // 隐藏的板块，导航里也不出现
    nav.appendChild(el('a', {
      text: cfg.title,
      attrs: { href: '#' + cfg.key, 'data-target': cfg.key }
    }));
  });
}

/**
 * 渲染页脚：GitHub / 邮箱 / 电话入口 + 「打印」按钮 + 「最后更新」时间戳。
 * @param {Object} profile - 整个 PROFILE 对象（取其中的 contact / footer / updatedAt）
 */
function renderFooter(profile) {
  const contact = (profile && profile.contact) || {};
  const footerConfig = (profile && profile.footer) || {};

  const note = byId('footerNote');
  if (note) note.textContent = footerConfig.note || '';

  const links = byId('footerLinks');
  if (!links) return;
  clear(links);

  // GitHub 入口（未填写则隐藏）
  if (!isPlaceholder(contact.github)) {
    links.appendChild(el('a', {
      text: 'GitHub',
      attrs: { href: contact.github, target: '_blank', rel: 'noopener noreferrer' }
    }));
  }
  // 邮箱：占位符时自动隐藏，页面不会出现「待填写」字样
  if (!isPlaceholder(contact.email)) {
    links.appendChild(el('a', {
      text: contact.email,
      attrs: { href: 'mailto:' + contact.email }
    }));
  }
  // 手机号：默认留空 → 自动隐藏。
  // ★ 安全提示：公开网页的手机号会被爬虫抓取，如无必要请保持留空。
  if (!isPlaceholder(contact.phone)) {
    links.appendChild(el('a', {
      text: contact.phone,
      attrs: { href: 'tel:' + contact.phone }
    }));
  }
  // 简历 PDF 下载（与 Hero 的主按钮指向同一份文件，页脚再给一个入口）
  const resumeCfg = (profile && profile.resume) || {};
  if (!isPlaceholder(resumeCfg.file)) {
    links.appendChild(el('a', {
      text: '下载 PDF 简历',
      attrs: {
        href: resumeCfg.file,
        download: resumeCfg.downloadName || ''
      }
    }));
  }
  // 打印按钮：★ 明确区分于上方「下载 PDF 简历」——
  //   这一份打印的是「本页」（科幻风视觉版，多列 + 图形，ATS 无法解析），
  //   投递请用上方的 ATS 友好版 PDF。
  const printBtn = el('button', {
    className: 'btn',
    text: '打印本页（视觉版）',
    attrs: { type: 'button', id: 'printBtn' }
  });
  links.appendChild(printBtn);

  // ── 「最后更新」时间戳（V15）──
  // 值取自 PROFILE.updatedAt（格式 'YYYY-MM'）。留空 / 未填时**整行不渲染**，
  // 页面绝不出现 undefined 字样（沿用 isPlaceholder 判定）。
  if (!isPlaceholder(profile && profile.updatedAt)) {
    links.appendChild(el('span', {
      className: 'sync mono',
      text: '最后更新：' + String(profile.updatedAt).trim(),
      attrs: { id: 'footerSync' }
    }));
  }
}


/* ============================================================================
 *  PART 5 · 主题服务
 *  ──────────────────────────────────────────────────────────────────────────
 *  ⚠️ 属于逻辑层，通常不需要改。
 * ============================================================================ */

/**
 * 应用主题：这是**唯一**修改主题的入口。
 * 做法：给 <html> 设置 data-theme 属性，CSS 里的 [data-theme="..."] 块随即生效。
 * @param {string} key - 主题 key，如 'cyber-neon'
 */
function applyTheme(key) {
  const safeKey = THEMES[key] ? key : DEFAULT_THEME;     // 传入非法 key 时回到默认主题
  document.documentElement.setAttribute('data-theme', safeKey);
  currentTheme = safeKey;

  // ★ 粒子配色跟随主题：必须放在 setAttribute 之后，这样 getComputedStyle
  //   读到的就是新主题的 --accent / --accent-2 / --glow。
  //   ⚠️ applyTheme 在 init() 最开头就会被调用，那时粒子层还没初始化 ——
  //       refreshParticleTheme() 内部有空值保护，会安全地直接返回，不抛错。
  refreshParticleTheme();

  // 同步更新切换按钮上的文字与选项的高亮状态
  const label = byId('themeToggleLabel');
  if (label && THEMES[safeKey]) label.textContent = THEMES[safeKey].label;

  const options = document.querySelectorAll('.theme-option');
  options.forEach(function (btn) {
    const isCurrent = btn.getAttribute('data-theme-key') === safeKey;
    btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
  });
}

/** 当前主题 key（由 applyTheme 维护） */
let currentTheme = DEFAULT_THEME;

/**
 * 读取 localStorage 里保存的主题（读取失败时返回默认主题）。
 * 说明：用 try/catch 包住，因为某些浏览器在本地文件模式下可能禁用 localStorage。
 * @returns {string} 主题 key
 */
function readStoredTheme() {
  try {
    const saved = window.localStorage.getItem(THEME_STORAGE_KEY);
    if (saved && THEMES[saved]) return saved;
  } catch (err) {
    // 读取失败不影响功能，静默回退到默认主题
  }
  return DEFAULT_THEME;
}

/**
 * 把主题写入 localStorage（失败不影响页面）。
 * @param {string} key
 */
function persistTheme(key) {
  try {
    window.localStorage.setItem(THEME_STORAGE_KEY, key);
  } catch (err) {
    // 写入失败（如隐私模式）不影响本次切换，仅下次打开不能记住
  }
}

/**
 * 初始化主题：优先用上次记住的，否则用 DEFAULT_THEME。
 * 在 init() 中最先调用，避免首屏配色跳变。
 */
function initTheme() {
  applyTheme(readStoredTheme());
}

/**
 * 生成主题按钮（依据 THEMES 自动生成）并绑定点击事件。
 * ★ 加第五套主题时，这里不用改任何代码 —— 按钮会自动多一个。
 */
function bindThemeSwitcher() {
  const switcher = byId('themeSwitcher');
  const toggleBtn = byId('themeToggle');
  const menu = byId('themeMenu');
  if (!switcher || !toggleBtn || !menu) return;

  // 1) 依据 THEMES 生成四个（或更多）选项按钮
  clear(menu);
  Object.keys(THEMES).forEach(function (key) {
    const theme = THEMES[key];
    const option = el('button', {
      className: 'theme-option',
      attrs: {
        type: 'button',
        'data-theme-key': key,
        'aria-pressed': 'false',
        'aria-label': '切换到 ' + theme.label + ' 主题'
      }
    });
    option.appendChild(el('span', {
      className: 'swatch',
      attrs: { style: 'background:' + theme.swatch, 'aria-hidden': 'true' }
    }));
    const meta = el('span', { className: 'meta' });
    meta.appendChild(el('span', { text: theme.label }));
    meta.appendChild(el('small', { text: theme.desc }));
    option.appendChild(meta);

    // 点击某个主题 → 应用 + 持久化 + 收起面板
    option.addEventListener('click', function () {
      applyTheme(key);
      persistTheme(key);
      closeMenu();
    });

    menu.appendChild(option);
  });

  // 2) 点击主按钮：展开 / 收起面板
  function openMenu() {
    switcher.classList.add('is-open');
    toggleBtn.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    switcher.classList.remove('is-open');
    toggleBtn.setAttribute('aria-expanded', 'false');
  }
  toggleBtn.addEventListener('click', function (event) {
    event.stopPropagation();
    if (switcher.classList.contains('is-open')) closeMenu(); else openMenu();
  });

  // 3) 点击页面其他位置 / 按 Esc：收起面板
  document.addEventListener('click', function (event) {
    if (!switcher.contains(event.target)) closeMenu();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeMenu();
  });

  // 4) 同步一次当前高亮状态
  applyTheme(currentTheme);
}


/* ============================================================================
 *  PART 6 · 交互增强（可降级：即使这些功能失效，页面依然完整可用）
 * ============================================================================ */

/**
 * 判断用户是否开启了「减少动态效果」。
 * @returns {boolean}
 */
function respectsReducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/**
 * 滚动高亮：滚动到哪个板块，顶部导航对应项就亮起来。
 * 【可降级】不支持 IntersectionObserver 的浏览器会自动跳过，不影响使用。
 */
function initScrollSpy() {
  if (!('IntersectionObserver' in window)) return;

  const links = document.querySelectorAll('.nav a[data-target]');
  if (!links.length) return;

  const sections = [];
  links.forEach(function (link) {
    const target = document.getElementById(link.getAttribute('data-target'));
    if (target) sections.push({ id: target.id, link: link, node: target });
  });
  if (!sections.length) return;

  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      sections.forEach(function (item) {
        const active = item.id === entry.target.id;
        item.link.classList.toggle('is-active', active);
        // 无障碍（P2-19）：让读屏软件也知道「当前在哪个板块」
        if (active) item.link.setAttribute('aria-current', 'true');
        else item.link.removeAttribute('aria-current');
      });
    });
  }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });

  sections.forEach(function (item) { observer.observe(item.node); });
}

/**
 * 悬停导航：鼠标划过导航项即滚动到对应板块（无需点击）。
 * 设计要点：
 *   · 即时触发，没有任何延时 —— 划过哪一项就跳哪一项。
 *   · 用 scrollIntoView 而非改 location.hash —— 不污染浏览器后退历史。
 *   · 保留一个「重复触发闸门」：顶栏是 position: fixed，跳转过程中鼠标可能
 *     仍停在原项上，浏览器在滚动时可能重新派发 hover 事件。没有这道闸门，
 *     同一个导航项会被反复触发。这不是「防误触」，是防死循环，故保留。
 *   · 未拦截任何事件：点击 / 键盘 / 触屏的原有行为完全不受影响。
 * 【可降级】开启「减少动态效果」时为瞬时跳转。
 */
function initHoverNav() {
  const links = document.querySelectorAll('.nav a[data-target]');
  if (!links.length) return;

  const instant = respectsReducedMotion(); // 减少动态效果 → 瞬时跳转

  links.forEach(function (link) {
    let fired = false;                     // 本次悬停是否已触发过

    link.addEventListener('mouseenter', function () {
      if (fired) return;                   // 同一项在一次悬停内只跳一次
      fired = true;
      const target = document.getElementById(link.getAttribute('data-target'));
      if (target) {
        target.scrollIntoView({ behavior: instant ? 'auto' : 'smooth', block: 'start' });
      }
    });

    link.addEventListener('mouseleave', function () {
      fired = false;                       // 移开后重新武装，可再次触发
    });
  });
}

/**
 * 入场动画：元素滚动进入视口时「轻微上移 + 淡入」，同一容器内的兄弟元素依次
 * 错峰出现（stagger），营造逐层展开的流畅感。
 *
 * 覆盖范围：卡片 / 板块标题 / 数字仪表盘 / 键值行 / 兴趣卡 / 时间线条目 /
 *           技能分组 / 项目标题行 / 要点列表项 / 数据网格 / 技术栈标签 /
 *           荣誉卡 / 语言卡 / 页脚内容。
 *
 * 错峰算法：按「父容器」分组，同一父容器内第 i 个目标元素延迟 i × FX.reveal.stagger
 *           毫秒（上限 FX.reveal.staggerMax）。延迟通过 CSS 自定义属性
 *           --reveal-delay 传给样式表（见 CSS ⑧ 段的 transition-delay）。
 *
 * 【可降级 · 四重保险】
 *   ① FX.reveal.enabled === false      → 直接 return，内容静态显示；
 *   ② FX 或 FX.reveal 整块缺失          → 按「开启 + 默认参数」正常工作，**绝不抛错**
 *      （宽容读取，而不是解引用 undefined）；
 *   ③ respectsReducedMotion() 为真      → 直接 return（且 CSS 里的 .reveal 定义
 *      整个位于 @media (prefers-reduced-motion: no-preference) 内，本就不生效）
 *      → 元素保持 opacity:1，绝不会出现「内容永远看不见」；
 *   ④ 浏览器不支持 IntersectionObserver → 直接 return，内容静态显示。
 *   另外：进入视口后立刻 unobserve，动画只播一次，不反复消耗性能。
 */
function initReveal() {
  // ★ 宽容读取配置：FX 或 FX.reveal 整个缺失时按「开启 + 默认参数」处理，
  //   绝不因为「新加的配置块没写 / 被误删」而抛错、更不牵连后面的打印按钮与粒子层。
  const cfg = fxConfig('reveal');
  if (fxFlag(cfg, 'enabled', true) === false) return;  // 只有明确写 false 才关闭
  if (respectsReducedMotion()) return;                 // 尊重系统设置：不动画
  if (!('IntersectionObserver' in window)) return;     // 老浏览器：不动画

  // 缺配置时的默认参数（与 PART 1.6 里 FX.reveal 的默认值保持一致）
  const stagger    = fxNumber(cfg, 'stagger', 70);
  const staggerMax = fxNumber(cfg, 'staggerMax', 420);
  const distance   = fxNumber(cfg, 'distance', 14);
  const duration   = fxNumber(cfg, 'duration', 560);

  // ⚠️ 这些元素都是 init() 里由 render*() 动态生成的，所以本函数必须在它们之后调用
  //    （PART 7 的调用顺序已满足，勿改动）。
  // ⚠️ 不要再往里加 .tag（单数）：那 10 个技术栈小标签全部位于 .stack 内部，
  //    而 .stack 本身已经是动画目标，父子同时淡入会变成嵌套动画。
  const targets = document.querySelectorAll(
    '.card, .section-head, .meters, .kv, .interest, ' +
    '.timeline-item, .skill-group, .project-head, .bullets li, ' +
    '.facts, .stack, .achievement-card, .lang, .footer-inner'
  );
  if (!targets.length) return;

  const seen = new Map();                              // 父容器 → 该容器内已排到第几个

  targets.forEach(function (node) {
    // 同一父容器内的兄弟元素依次延迟；不同容器各自从 0 开始
    const parent = node.parentNode || document.body;
    const index = seen.has(parent) ? seen.get(parent) : 0;
    seen.set(parent, index + 1);

    const delay = Math.min(index * stagger, staggerMax);
    node.style.setProperty('--reveal-delay', delay + 'ms');
    node.style.setProperty('--reveal-distance', distance + 'px');
    node.style.setProperty('--reveal-duration', duration + 'ms');
    node.classList.add('reveal');
  });

  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);              // 只淡入一次
      }
    });
  }, { rootMargin: '0px 0px -24px 0px', threshold: 0.05 });
  // ⚠️ rootMargin 的底部只收 24px（固定值，不用百分比）：
  //    页脚 .footer-inner 距文档底部固定 48px，用百分比在大屏上会把它整块挡在
  //    「有效视口」之外，导致它永远不触发、永远停在 opacity:0 —— 必须避免。

  targets.forEach(function (node) { observer.observe(node); });
}

/**
 * 绑定「打印 / 导出 PDF」按钮。
 * 说明：用浏览器原生打印（在弹窗里选择「另存为 PDF」即可）。
 */
function bindPrintButton() {
  const btn = byId('printBtn');
  if (!btn) return;
  btn.addEventListener('click', function () {
    window.print();
  });
}


/* ============================================================================
 *  PART 6.5 · 粒子背景（Canvas 2D）
 *  ──────────────────────────────────────────────────────────────────────────
 *  ⚠️ 属于逻辑层，通常不需要改；想调效果 / 关掉它请回到 PART 1.6 的 FX。
 *
 *  设计要点：
 *   · 纯装饰：canvas 带 pointer-events:none + aria-hidden，
 *     既不拦截正文的鼠标事件与点击，也不干扰读屏软件。
 *   · 颜色跟随主题：只从 CSS 变量读 --accent / --accent-2 / --glow，
 *     JS 里**不出现任何硬编码颜色**。切主题时 applyTheme() 会调用
 *     refreshParticleTheme() 重建光点贴图 → 粒子颜色即时变化，无需刷新。
 *   · 性能：全站只有 1 个 requestAnimationFrame 循环；devicePixelRatio 上限 2；
 *     resize 防抖 150ms；页面不可见时 cancelAnimationFrame 暂停（省电）；
 *     每帧不调用 getComputedStyle；光点用**预渲染的径向渐变贴图** drawImage
 *     绘制，比逐帧 arc + shadowBlur 快得多。
 *   · 降级：FX.particles.enabled=false → 什么都不做；FX / FX.particles 整块缺失
 *     → 按默认参数正常工作（不抛错）；getContext('2d') 返回 null → 静默跳过；
 *     prefers-reduced-motion:reduce → 不启动动画循环，只画一帧静态图。
 * ============================================================================ */

/**
 * 把 FX.particles 归一化成一份「字段保证齐全」的配置。
 * ★ 宽容读取：FX 或 FX.particles 整个缺失时按默认值处理，绝不抛错。
 * ★ 归一化后缓存在 PARTICLE.cfg 里 —— 之后每帧都读缓存，不再碰全局配置。
 * @returns {Object} 字段齐全的粒子配置
 */
function particleConfig() {
  const raw = fxConfig('particles');
  return {
    // ★ 只有明确写 false 才关闭；缺配置时按「开启」处理
    enabled: fxFlag(raw, 'enabled', true),
    density:       fxNumber(raw, 'density', 12500),
    minCount:      fxNumber(raw, 'minCount', 36),
    maxCount:      fxNumber(raw, 'maxCount', 160),
    speed:         fxNumber(raw, 'speed', 1),
    size:          fxNumber(raw, 'size', 1),
    opacity:       fxNumber(raw, 'opacity', 1),
    mouseRadius:   fxNumber(raw, 'mouseRadius', 140),
    mouseStrength: fxNumber(raw, 'mouseStrength', 1),
    parallax:      fxNumber(raw, 'parallax', 1)
  };
}

/** 粒子层运行时状态（集中在一个对象里，避免污染全局命名空间） */
const PARTICLE = {
  cfg: particleConfig(), // 归一化后的粒子配置（缺配置时即为一套完整默认值）
  canvas: null,          // <canvas id="particleCanvas">
  ctx: null,             // 2D 上下文
  items: [],             // 粒子数组
  w: 0,                  // 视口宽（CSS px）
  h: 0,                  // 视口高（CSS px）
  dpr: 1,                // 设备像素比（上限 2）
  raf: 0,                // requestAnimationFrame 句柄（全站唯一一个）
  running: false,        // 动画循环是否在跑
  started: false,        // 是否已成功初始化
  reduced: false,        // 用户是否要求「减少动态效果」
  last: 0,               // 上一帧时间戳
  parallaxY: 0,          // 整场垂直视差的当前偏移（平滑逼近目标值）
  spriteA: null,         // 主色光点贴图（由 --accent 生成）
  spriteB: null,         // 次色光点贴图（由 --accent-2 生成）
  mouse: { x: 0, y: 0, active: false, energy: 0 }   // 鼠标状态（只记坐标，不做任何 DOM 操作）
};

/**
 * 把 CSS 颜色值解析成 "r,g,b" 三元组字符串。
 * 支持 #rgb / #rrggbb / rgb() / rgba() 四种写法。
 * ⚠️ 解析不了时返回空字符串，调用方据此跳过绘制 ——
 *    这样 JS 里就不需要写任何硬编码兜底色（配色永远由 CSS 主题说了算）。
 * @param {string} value - CSS 颜色值
 * @returns {string} 形如 "77,163,255"，失败时返回 ''
 */
function toRgbTriplet(value) {
  const text = String(value === null || value === undefined ? '' : value).trim();
  if (!text) return '';

  if (text.charAt(0) === '#') {
    let hex = text.slice(1);
    if (hex.length === 3) {
      hex = hex.charAt(0) + hex.charAt(0) + hex.charAt(1) + hex.charAt(1) + hex.charAt(2) + hex.charAt(2);
    }
    if (hex.length !== 6 || !/^[0-9a-fA-F]{6}$/.test(hex)) return '';
    return parseInt(hex.slice(0, 2), 16) + ',' +
           parseInt(hex.slice(2, 4), 16) + ',' +
           parseInt(hex.slice(4, 6), 16);
  }

  const m = text.match(/^rgba?\(\s*([0-9.]+)\s*[, ]\s*([0-9.]+)\s*[, ]\s*([0-9.]+)/i);
  if (m) return Math.round(Number(m[1])) + ',' + Math.round(Number(m[2])) + ',' + Math.round(Number(m[3]));
  return '';
}

/**
 * 预渲染一颗「柔和发光」的光点贴图（径向渐变）。
 * 之后每帧只需要 drawImage 缩放贴图，避免逐帧画渐变 / 用 shadowBlur 带来的开销。
 * @param {string} core - 核心色，形如 "77,163,255"
 * @param {string} halo - 光晕色，形如 "77,163,255"
 * @returns {HTMLCanvasElement|null}
 */
function createGlowSprite(core, halo) {
  const R = 24;                                   // 贴图半径（px），绘制时缩放到实际粒子大小
  const sprite = document.createElement('canvas');
  sprite.width = R * 2;
  sprite.height = R * 2;
  const c = sprite.getContext('2d');
  if (!c) return null;

  const g = c.createRadialGradient(R, R, 0, R, R, R);
  g.addColorStop(0,    'rgba(' + core + ',1)');    // 实心核心
  g.addColorStop(0.22, 'rgba(' + core + ',.72)');
  g.addColorStop(0.5,  'rgba(' + halo + ',.26)');  // 柔和光晕
  g.addColorStop(1,    'rgba(' + halo + ',0)');    // 边缘完全透明
  c.fillStyle = g;
  c.beginPath();
  c.arc(R, R, R, 0, Math.PI * 2);
  c.fill();
  return sprite;
}

/**
 * 读取当前主题的粒子配色（只读 CSS 变量，绝不硬编码颜色）。
 * @returns {{accent:string, accent2:string, glow:string}|null} 读不到时返回 null
 */
function readThemeColors() {
  try {
    const cs = window.getComputedStyle(document.documentElement);
    if (!cs) return null;
    const accent = String(cs.getPropertyValue('--accent') || '').trim();
    if (!accent) return null;
    return {
      accent:  accent,
      accent2: String(cs.getPropertyValue('--accent-2') || '').trim(),
      glow:    String(cs.getPropertyValue('--glow') || '').trim()
    };
  } catch (err) {
    return null;                                  // 极端环境下不可用 → 静默跳过，不影响页面
  }
}

/**
 * 主题切换钩子：重建光点贴图，让粒子颜色立刻跟着新主题变。
 * ★ 由 applyTheme() 调用，而 applyTheme() 在 init() 最开头就会跑一次
 *   —— 那时粒子层还没初始化，所以这里**必须先做空值保护并直接返回**。
 */
function refreshParticleTheme() {
  if (!PARTICLE.canvas) return;                   // 尚未初始化 / FX 里已关闭粒子 → 安全返回
  const colors = readThemeColors();
  if (!colors) return;

  const core = toRgbTriplet(colors.accent);
  if (!core) return;                              // 主题色读不到 → 保持原样（不硬编码兜底色）
  const core2 = toRgbTriplet(colors.accent2) || core;
  const halo = toRgbTriplet(colors.glow) || core;

  PARTICLE.spriteA = createGlowSprite(core, halo);
  PARTICLE.spriteB = createGlowSprite(core2, halo);

  // 「减少动态效果」模式下没有动画循环，需要手动重画一帧，颜色才会更新
  if (PARTICLE.reduced) drawParticles();
}

/**
 * 按视口面积算出粒子数量（带上下限约束）。
 * 面积越大粒子越多；配置里的 density 表示「每个粒子分到多少平方像素」，
 * 所以数值越小 → 粒子越密。窄屏（<768px）再砍一半，保证手机端省电。
 *
 * ★ 「先截断到 [minCount, maxCount]、再砍半」这条顺序带来两条硬保证：
 *   ①  上界：任何窄屏（< 768px）最多 maxCount / 2 = 80 颗，手机上不可能失控；
 *   ②  相对关系：同一个视口尺寸下，窄屏算出的数量恒为「不减半」时的一半
 *       —— 因为砍半发生在截断之后，不存在「先砍半再被下限抬回去」的翻转。
 *
 * ⚠️ 但要诚实说明一个副作用（这是「下限保底」的必然结果，不是 bug）：
 *   由于 minCount 会把小屏的数量托到 36（再砍半 = 18），
 *   320×480 这种极小的屏，单位面积粒子密度会略高于 1440×900 的大屏
 *   （实测每颗粒子占地：小屏约 8500 px²、大屏约 12600 px²）。
 *   这是刻意为之 —— 小屏若按公式算只有 7 颗，画面会空得像坏了。
 *   并且本次调整后这个差距是**缩小**的（改前小屏 12800 px² / 大屏 22300 px²），
 *   所以「窄屏反而比桌面还密」的观感在本次调整中是改善而非恶化。
 *   下限同理：砍半后手机端恒 ≥ minCount/2 = 18 颗，不会出现「窄屏只有 3 颗」。
 * @param {number} w - 视口宽（CSS px）
 * @param {number} h - 视口高（CSS px）
 * @returns {number}
 */
function particleCount(w, h) {
  const cfg = PARTICLE.cfg;
  const density = cfg.density > 0 ? cfg.density : 12500;   // 防御：配置误写成 0 / 负数
  let n = Math.floor((w * h) / density);
  n = Math.max(cfg.minCount, Math.min(cfg.maxCount, n));   // 上下限
  if (w < 768) n = Math.round(n / 2);                      // 移动端再砍半
  return Math.max(6, n);
}

/**
 * 创建一颗粒子。
 * @returns {Object}
 */
function createParticle() {
  const cfg = PARTICLE.cfg;
  const x = Math.random() * PARTICLE.w;
  const y = Math.random() * PARTICLE.h;
  return {
    x: x,
    y: y,
    baseX: x,                                       // 弹簧回复的基准位置（横向基准）
    baseY: y,                                       // 弹簧回复的基准位置（会随时间缓慢上浮）
    vx: 0,
    vy: 0,
    r: (0.6 + Math.random() * 1.8) * cfg.size,      // 半径 0.6 ~ 2.4px（× 尺寸倍率）
    alpha: 0.25 + Math.random() * 0.55,             // 基础透明度随机，层次更自然
    drift: 0.06 + Math.random() * 0.14,             // 向上漂浮速度（px/帧）
    swayAmp: 4 + Math.random() * 10,                // 横向摆动幅度（px）
    swaySpeed: 0.0006 + Math.random() * 0.0012,     // 横向摆动快慢（周期约 5 ~ 10 秒）
    phase: Math.random() * Math.PI * 2,             // 摆动相位（避免所有粒子同步摆动）
    sprite: Math.random() < 0.5 ? 0 : 1             // 用主色还是次色贴图
  };
}

/**
 * 让粒子数量与当前视口匹配。
 * ★ 保留已有粒子、只增删差额 —— 避免 resize 时整场粒子重新随机、视觉上「跳一下」。
 */
function syncParticleCount() {
  const target = particleCount(PARTICLE.w, PARTICLE.h);
  const items = PARTICLE.items;
  while (items.length > target) items.pop();
  while (items.length < target) items.push(createParticle());

  // 视口变小后把跑到屏幕外的粒子拉回来，避免它们长时间不可见
  items.forEach(function (p) {
    if (p.baseX > PARTICLE.w) p.baseX = Math.random() * PARTICLE.w;
    if (p.baseY > PARTICLE.h) p.baseY = Math.random() * PARTICLE.h;
    if (p.x > PARTICLE.w + 24) p.x = p.baseX;
    if (p.y > PARTICLE.h + 24) p.y = p.baseY;
  });
}

/**
 * 调整画布尺寸（CSS 尺寸 + 物理像素尺寸），并同步粒子数量。
 * ★ devicePixelRatio 上限取 2：3x 屏上若不封顶，像素量会涨到 2.25 倍，低端机直接掉帧。
 * ★ 用 ctx.setTransform 做缩放，所以这里直接改 width/height 是安全的。
 */
function resizeParticles() {
  const canvas = PARTICLE.canvas;
  if (!canvas) return;

  const w = Math.max(1, window.innerWidth || 1);
  const h = Math.max(1, window.innerHeight || 1);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.round(w * dpr);
  const ph = Math.round(h * dpr);

  PARTICLE.w = w;
  PARTICLE.h = h;
  PARTICLE.dpr = dpr;

  if (canvas.width !== pw || canvas.height !== ph) {
    canvas.width = pw;                              // 赋值会清空画布，下一帧会重画
    canvas.height = ph;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  syncParticleCount();
}

/**
 * 推进一帧物理。三个力 + 一个阻尼：
 *   ① 基础漂移：缓慢向上漂浮（到顶后从底部循环）+ 轻微横向正弦摆动（深空/上升感）；
 *   ② 鼠标「垂直排斥」：鼠标周围 mouseRadius 内的粒子沿 **Y 轴**被推开
 *      （水平方向的力刻意只给 1/6 左右 —— 需求强调的是「垂直方向上下浮动」）；
 *   ③ 弹簧回复：粒子始终被缓慢拉回自己的基准位置，保证「推开后会自然归位」；
 *   ④ 阻尼：速度每帧 ×0.94，让运动收敛 —— 既不会越弹越飞，也不会抖成噪声。
 * @param {number} dt - 时间步长（1 ≈ 60fps 的一帧）
 */
function stepParticles(dt) {
  const cfg = PARTICLE.cfg;
  const items = PARTICLE.items;
  const mouse = PARTICLE.mouse;
  const t = PARTICLE.last;

  const radius = cfg.mouseRadius > 0 ? cfg.mouseRadius : 140;
  const radius2 = radius * radius;
  const strength = cfg.mouseStrength * mouse.energy;   // energy 让鼠标离开后效果平滑衰减

  for (let i = 0; i < items.length; i++) {
    const p = items[i];

    // ① 基础漂移：向上漂浮 + 横向摆动
    p.baseY -= p.drift * cfg.speed * dt;
    if (p.baseY < -12) {
      // 飘出顶部后从底部重新进场。
      // ★ 位置与速度必须一起重置：只改 baseY 会让粒子被弹簧从屏幕顶部一路
      //   「拽」到底部，变成一道横穿整屏的流星（实测速度可达 15px/帧）。
      p.baseX = Math.random() * PARTICLE.w;
      p.baseY = PARTICLE.h + 12;
      p.x = p.baseX;
      p.y = p.baseY;
      p.vx = 0;
      p.vy = 0;
    }
    const sway = Math.sin(t * p.swaySpeed + p.phase) * p.swayAmp;

    // ② 鼠标垂直排斥
    if (strength > 0.001) {
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < radius2 && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const falloff = 1 - d / radius;              // 越靠近鼠标，力越大（0 ~ 1）
        const push = falloff * falloff * 0.28 * strength;
        // ★ 垂直方向：主作用力 —— 粒子在鼠标下方就继续往下让、在上方就往上让
        p.vy += (dy >= 0 ? push : -push) * dt;
        // 水平方向：只给很弱的力，保证「上下浮动」是主视觉
        p.vx += (dx / d) * push * 0.16 * dt;
      }
    }

    // ③ 弹簧回复（目标 = 基准位置 + 横向摆动量）
    p.vx += (p.baseX + sway - p.x) * 0.008 * dt;
    p.vy += (p.baseY - p.y) * 0.008 * dt;

    // ④ 阻尼（收敛）
    p.vx *= 0.94;
    p.vy *= 0.94;

    // ⑤ 积分
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

/**
 * 整场垂直视差：鼠标在视口里的 Y 位置偏离中心时，给整片粒子一个很小的整体垂直
 * 偏移（默认 ±14px），让「鼠标上下移动 → 整片粒子随之起伏」。
 * 幅度克制，并且用插值平滑逼近，不会突跳。
 * @param {number} dt - 时间步长
 */
function updateParallax(dt) {
  const mouse = PARTICLE.mouse;
  const half = PARTICLE.h / 2 || 1;
  let target = 0;
  if (mouse.energy > 0.001) {
    target = ((half - mouse.y) / half) * 14 * PARTICLE.cfg.parallax * mouse.energy;
  }
  if (target > 20) target = 20;
  if (target < -20) target = -20;
  PARTICLE.parallaxY += (target - PARTICLE.parallaxY) * Math.min(1, 0.06 * dt);

  // 鼠标能量平滑衰减：鼠标离开窗口 / 手指抬起后，效果自然收回去，不会突然中断
  PARTICLE.mouse.energy += ((mouse.active ? 1 : 0) - mouse.energy) * Math.min(1, 0.05 * dt);
}

/**
 * 绘制一帧（纯绘制，不改物理状态）。
 * 做法：先用单位变换清空整块画布，再设成「dpr 缩放 + 整场垂直视差偏移」，
 *       最后逐个 drawImage 光点贴图。
 */
function drawParticles() {
  const ctx = PARTICLE.ctx;
  const canvas = PARTICLE.canvas;
  if (!ctx || !canvas) return;

  const items = PARTICLE.items;
  if (!items.length) return;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const opMul = PARTICLE.cfg.opacity;
  if (!(opMul > 0)) return;                         // 透明度倍率为 0 → 不必画

  const dpr = PARTICLE.dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, PARTICLE.parallaxY * dpr);

  const GLOW_SCALE = 3;                             // 贴图半径 = 粒子半径 × 3（含光晕）
  for (let i = 0; i < items.length; i++) {
    const p = items[i];
    const sprite = p.sprite === 0 ? PARTICLE.spriteA : PARTICLE.spriteB;
    if (!sprite) continue;
    const size = p.r * GLOW_SCALE * 2;
    let a = p.alpha * opMul;
    if (a > 1) a = 1;
    if (a < 0) a = 0;
    ctx.globalAlpha = a;
    ctx.drawImage(sprite, p.x - size / 2, p.y - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}

/**
 * 单帧驱动（全站唯一的 requestAnimationFrame 循环）。
 * @param {number} now - 高精度时间戳
 */
function particleFrame(now) {
  if (!PARTICLE.running) return;

  let dt = PARTICLE.last ? (now - PARTICLE.last) / 16.667 : 1;
  PARTICLE.last = now;
  if (!(dt > 0)) dt = 1;
  if (dt > 3) dt = 3;                               // 掉帧 / 从后台切回时不要「瞬移」

  updateParallax(dt);

  // 装饰层万一出错：安静停下即可，绝不让 Console 反复刷红色报错
  try {
    stepParticles(dt);
    drawParticles();
  } catch (err) {
    stopParticles();
    return;
  }

  PARTICLE.raf = window.requestAnimationFrame(particleFrame);
}

/** 启动动画循环（同一时刻只会存在一个） */
function startParticles() {
  if (!PARTICLE.canvas || PARTICLE.running || PARTICLE.reduced) return;
  PARTICLE.running = true;
  PARTICLE.last = 0;
  PARTICLE.raf = window.requestAnimationFrame(particleFrame);
}

/** 停止动画循环并释放 rAF 句柄 */
function stopParticles() {
  PARTICLE.running = false;
  if (PARTICLE.raf) {
    window.cancelAnimationFrame(PARTICLE.raf);
    PARTICLE.raf = 0;
  }
}

/**
 * 绑定粒子层的事件：鼠标 / 触屏 / 窗口尺寸 / 页面可见性 / 系统动效偏好。
 * ★ 全部监听器都是 { passive: true }；回调里**只记录坐标**，
 *   不做任何 DOM 读写、不做 canvas 重绘 —— 这是性能红线。
 */
function bindParticleEvents() {
  // 1) 鼠标移动：只记坐标
  window.addEventListener('mousemove', function (event) {
    PARTICLE.mouse.x = event.clientX;
    PARTICLE.mouse.y = event.clientY;
    PARTICLE.mouse.active = true;
  }, { passive: true });

  // 2) 鼠标离开文档：active 置 false，energy 会自己平滑衰减，粒子自然归位。
  //    ★ 这两个必须挂在 document 上而不是 window 上 —— mouseleave 不冒泡，
  //      它的派发目标就是「指针离开的那个文档」，挂 window 收不到。
  //    ★ 同时挂 mouseleave 与 mouseout 两种写法：各家浏览器（尤其微信内核）
  //      对「鼠标离开窗口」的派发不一致，两个都挂最保险；回调里都只写一个布尔值。
  document.addEventListener('mouseleave', function () {
    PARTICLE.mouse.active = false;
  }, { passive: true });
  document.addEventListener('mouseout', function (event) {
    // relatedTarget 为空 = 指针离开了整个文档（而不是在元素之间移动）
    if (!event.relatedTarget && !event.toElement) PARTICLE.mouse.active = false;
  }, { passive: true });
  // 2b) 窗口失焦（切标签页 / Alt+Tab）同样视为「鼠标不在了」
  window.addEventListener('blur', function () {
    PARTICLE.mouse.active = false;
  }, { passive: true });

  // 3) 触屏：手指滑动时同样产生互动；passive 保证**绝不阻塞页面滚动**
  window.addEventListener('touchmove', function (event) {
    const touch = event.touches && event.touches[0];
    if (!touch) return;
    PARTICLE.mouse.x = touch.clientX;
    PARTICLE.mouse.y = touch.clientY;
    PARTICLE.mouse.active = true;
  }, { passive: true });
  window.addEventListener('touchend', function () {
    PARTICLE.mouse.active = false;
  }, { passive: true });
  window.addEventListener('touchcancel', function () {
    PARTICLE.mouse.active = false;
  }, { passive: true });

  // 4) 窗口尺寸变化：防抖 150ms 后再重算画布与粒子数量
  let resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resizeTimer = 0;
      resizeParticles();
      if (PARTICLE.reduced) drawParticles();        // 静态帧：手动重画一次
    }, 150);
  }, { passive: true });

  // 5) 页面切到后台就暂停（省电，微信里尤其重要），回到前台再恢复
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopParticles();
    else startParticles();
  });

  // 6) 用户中途修改「减少动态效果」：立刻跟随（老浏览器不支持时静默跳过）
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    const onChange = function () {
      PARTICLE.reduced = mq.matches;
      if (PARTICLE.reduced) {
        stopParticles();
        drawParticles();                            // 保留一帧静态画面，不留空白
      } else {
        startParticles();
      }
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
}

/**
 * 初始化粒子背景层。
 * 每一步都有降级出口：任何一步失败都只是「没有粒子」，页面其余部分完全不受影响。
 * ★ 配置读取是「宽容」的：FX / FX.particles 整块缺失时按默认参数正常工作，
 *   绝不抛错、更不会牵连 init() 里排在前面的打印按钮等既有功能。
 */
function initParticles() {
  PARTICLE.cfg = particleConfig();                  // 重新归一化一次（缺配置 → 全套默认值）
  if (!PARTICLE.cfg.enabled) return;                // 配置里明确关掉 → 什么都不做

  const canvas = byId('particleCanvas');
  if (!canvas) return;                              // HTML 里没有画布 → 跳过

  let ctx = null;
  try {
    ctx = canvas.getContext('2d');
  } catch (err) {
    ctx = null;
  }
  if (!ctx) return;                                 // 不支持 Canvas 2D → 静默跳过

  PARTICLE.canvas = canvas;
  PARTICLE.ctx = ctx;
  PARTICLE.reduced = respectsReducedMotion();
  PARTICLE.started = true;

  // 读主题色 + 预渲染光点贴图（之后每帧都不再碰 getComputedStyle）
  refreshParticleTheme();
  if (!PARTICLE.spriteA) return;                    // 主题色读不到 → 不画（不留硬编码兜底色）

  resizeParticles();
  bindParticleEvents();

  if (PARTICLE.reduced) drawParticles();            // 减少动态效果：只画一帧静态画面，不跑循环
  else startParticles();                            // 否则启动唯一的那一个 rAF 循环
}


/* ============================================================================
 *  PART 7 · 总入口（safeInit 安全执行器 + init()）
 * ============================================================================ */

/**
 * 页面总入口：先应用主题（避免首屏配色跳变），再渲染内容，最后绑定交互。
 * ⚠️ 一般不需要改这个函数。
 */
/**
 * 安全执行一个初始化步骤：单步失败只跳过该步，绝不牵连后续步骤。
 * 这是本站「强制降级」铁律的实现方式 —— 任何新功能坏掉，页面其余部分照常可用。
 *
 * ★ 为什么必须有它：init() 里既有「新增特效」，也有「改动前就存在的打印按钮、
 *   导航、内容渲染」。如果新增特效抛错时不做隔离，异常会一路冒泡、让排在后面的
 *   既有功能一行都跑不到 —— 那就是「新增功能坏掉打死了老功能」，属于严重事故。
 *   有了这道隔离，最坏情况也只是「那个特效没生效」。
 * ★ 只 console.warn（黄色告警），不 console.error（红色报错）——
 *   站点要求控制台里不出现红色 error。
 *
 * @param {string} label - 步骤名称（只用于控制台提示）
 * @param {Function} fn - 要执行的初始化函数
 */
function safeInit(label, fn) {
  try {
    fn();
  } catch (err) {
    if (window.console && console.warn) {
      console.warn('[init] ' + label + ' 初始化失败，已跳过（页面其余功能不受影响）：', err);
    }
  }
}

/**
 * 页面总入口：先应用主题（避免首屏配色跳变），再渲染内容，最后绑定交互。
 *
 * ★ 每一步都套在 safeInit() 里：任何一步出错都只跳过那一步。
 *   例如新增的粒子特效坏掉时，改动前就存在的打印按钮、导航、内容渲染必须照常工作。
 * ★ 顺序与改动前完全一致，成功路径的行为零变化：
 *     主题 → 板块骨架 → 内容渲染 → 交互增强 → 粒子
 *   · initTheme() 必须最先（先定配色再上内容，避免闪一下白底）；
 *   · buildSections() 必须在所有 render*() 之前（渲染函数要靠它生成的容器 id）；
 *   · initParticles() 必须最后（它依赖主题已定 + DOM 已生成 + 入场动画已就位）。
 * ⚠️ 一般不需要改这个函数。
 */
function init() {
  // 1) 主题优先 —— 先定配色，再上内容，避免闪一下白底
  safeInit('主题初始化', initTheme);

  // 2) 按 SECTION_CONFIG 生成板块骨架（顺序 / 显隐 / 锚点 id 全部由配置决定）
  //    ⚠️ 必须排在所有 render* 之前：它们要靠这里生成的容器 id 找落点。
  safeInit('板块骨架', buildSections);

  // 3) 内容渲染（全部数据来自 PROFILE，页面里没有任何硬编码的个人信息）
  //    ★ 逐个独立包裹：某一板块渲染失败，其余板块与页脚照常出内容。
  safeInit('顶部导航', renderNav);
  safeInit('Hero 与个人档案', function () {
    renderProfile(PROFILE.identity, PROFILE.contact, PROFILE.meters, PROFILE.resume);
  });
  safeInit('教育背景', function () {
    renderEducation(PROFILE.education);
  });
  safeInit('技能矩阵', function () {
    renderSkills(PROFILE.skills, PROFILE.languages);
  });
  safeInit('项目作品', function () {
    renderProjects(PROFILE.projects);
  });
  safeInit('荣誉资质', function () {
    renderAchievements(PROFILE.achievements, PROFILE.achievementsNote);
  });
  safeInit('兴趣偏好', function () {
    renderInterests(PROFILE.interests);
  });
  safeInit('页脚', function () {
    renderFooter(PROFILE);
  });

  // 4) 交互增强（可降级）
  safeInit('主题切换器', bindThemeSwitcher);
  safeInit('滚动高亮', initScrollSpy);
  safeInit('悬停导航', initHoverNav);
  safeInit('滚动入场动画', initReveal);
  safeInit('打印按钮', bindPrintButton);

  // 5) 背景粒子（纯装饰，可关 / 可降级）
  //    ⚠️ 必须排在所有 render*() 之后（此时主题已定、DOM 已生成），
  //       且必须排在 initReveal() 之后 —— 它会读当前主题色生成光点贴图。
  safeInit('背景粒子', initParticles);
}

// DOM 解析完成后启动
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
